# CI: daily cron that fetches the latest stable Jibril release and opens a PR to bump
# the pinned version in src/action.js, action.yaml, and README.md (plus a dist rebuild).
#
# Required org variable: GARNET_CI_BOT_CLIENT_ID
# Required org secret:   GARNET_CI_BOT_PRIVATE_KEY

name: Update Jibril default version

on:
  schedule:
    - cron: "0 9 * * *"   # Daily at 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    name: Update Jibril default version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch latest stable Jibril release
        id: jibril
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh api "repos/garnet-org/jibril-releases/releases?per_page=50" \
            --jq '[.[] | select(.prerelease == false and .draft == false) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first | .tag_name')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::No stable semver Jibril release found"
            exit 1
          fi
          echo "Latest stable Jibril release: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if update is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.jibril.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="update-jibril-version/$VERSION"
          CURRENT_SRC=$(sed -n 's/^const JIBRIL_STABLE_VERSION = "\(.*\)"$/\1/p' src/action.js)
          CURRENT_YAML=$(sed -n '/jibril_version:/,/default:/{ s/[[:space:]]*default: "\([^"]*\)".*/\1/p }' action.yaml)
          CURRENT_README=$(sed -n -E 's/.*`jibril_version`[^|]+\|[^|]+\| `([^`]*)`[^|]*\|.*/\1/p' README.md)

          if [ "$CURRENT_SRC" = "$VERSION" ] && [ "$CURRENT_YAML" = "$VERSION" ] && [ "$CURRENT_README" = "$VERSION" ]; then
            echo "Already at $VERSION — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if gh pr list --head "$BRANCH" --json number --jq '.[0].number' 2>/dev/null | grep -q '^[0-9]'; then
            echo "PR already open for $BRANCH — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "src/action.js:  $CURRENT_SRC → $VERSION"
          echo "action.yaml:    $CURRENT_YAML → $VERSION"
          echo "README.md:      $CURRENT_README → $VERSION"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update src/action.js
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.jibril.outputs.version }}
        run: |
          set -euo pipefail
          sed -i 's/const JIBRIL_STABLE_VERSION = "[^"]*"/const JIBRIL_STABLE_VERSION = "'"$VERSION"'"/' src/action.js

      - name: Update action.yaml
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.jibril.outputs.version }}
        run: |
          set -euo pipefail
          sed -i '/jibril_version:/,/default:/{s/default: "[^"]*"/default: "'"$VERSION"'"/}' action.yaml

      - name: Update README.md
        if: steps.check.outputs.skip == 'false'
        env:
          VERSION: ${{ steps.jibril.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E 's/(`jibril_version`[^|]*\|[^|]*\| )`[^`]*`[^|]*/\1`'"$VERSION"'`             /' README.md

      - name: Setup Node
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Rebuild dist/
        if: steps.check.outputs.skip == 'false'
        run: |
          npm ci --include=dev
          npm run build

      - name: Generate GitHub App token
        if: steps.check.outputs.skip == 'false'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GARNET_CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.GARNET_CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get bot user ID
        if: steps.check.outputs.skip == 'false'
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.jibril.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="update-jibril-version/$VERSION"

          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          gh auth setup-git
          git checkout -b "$BRANCH"
          git add src/action.js action.yaml README.md dist/
          git commit -m "chore: update Jibril default version to $VERSION"
          git push origin "$BRANCH"

          cat > /tmp/pr-body.md << EOF
          Bumps the pinned Jibril version to the latest stable release: \`$VERSION\`.

          **Changed files:**
          - \`src/action.js\` — \`JIBRIL_STABLE_VERSION\` constant
          - \`action.yaml\` — \`jibril_version\` input default
          - \`README.md\` — configuration table default column
          - \`dist/\` — rebuilt bundles
          EOF

          gh pr create \
            --title "chore: update Jibril default version to $VERSION" \
            --body-file /tmp/pr-body.md \
            --base main \
            --head "$BRANCH"
