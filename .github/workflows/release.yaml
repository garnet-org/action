name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Release
    runs-on:
      - ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dogfooding
      - name: Run Garnet
        uses: ./
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          jibril_version: "v0.0"

      - name: Update major tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SEMVER_NUM='0|[1-9][0-9]*'
          SEMVER_CORE="(${SEMVER_NUM})\.(${SEMVER_NUM})\.(${SEMVER_NUM})"
          SEMVER_PRERELEASE_ID="(${SEMVER_NUM}|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)"
          SEMVER_PRERELEASE="${SEMVER_PRERELEASE_ID}(\.${SEMVER_PRERELEASE_ID})*"
          SEMVER_BUILD_ID='[0-9A-Za-z-]+'
          SEMVER_BUILD="${SEMVER_BUILD_ID}(\.${SEMVER_BUILD_ID})*"
          STABLE_REGEX="^v${SEMVER_CORE}(\+${SEMVER_BUILD})?$"
          PRERELEASE_REGEX="^v${SEMVER_CORE}-${SEMVER_PRERELEASE}(\+${SEMVER_BUILD})?$"

          if [[ "$TAG_NAME" =~ $STABLE_REGEX ]]; then
            MAJOR_TAG="${TAG_NAME%%.*}"
            RELEASE_TITLE="Garnet Runtime Review Action ${MAJOR_TAG}"

            git tag -f "$MAJOR_TAG" "$COMMIT_SHA"
            git push --force origin "refs/tags/$MAJOR_TAG"

            printf '%s\n' \
              "# Garnet Runtime Review $MAJOR_TAG" \
              "" \
              "Record execution chains and outbound connections from supported Linux x86_64 CI jobs." \
              "" \
              "Current version: \`$TAG_NAME\`" \
              "" \
              "## Usage" \
              "" \
              "\`\`\`yaml" \
              "permissions:" \
              "  contents: read" \
              "" \
              "steps:" \
              "  - uses: garnet-org/action@$COMMIT_SHA # $TAG_NAME" \
              "    with:" \
              '      api_token: $''{{ secrets.GARNET_API_TOKEN }}' \
              "\`\`\`" \
              "" \
              "A supplied \`api_token\` is used directly; no OIDC token is requested. To use OIDC instead, omit \`api_token\` and grant \`id-token: write\` alongside \`contents: read\`." \
              "" \
              "Without either credential, recording is skipped with a warning and a Job Summary explanation; the workflow continues. Fork and Dependabot runs can take this path." \
              "" \
              "The Action owns recording, upload and the local Execution Summary. The companion GitHub App owns PR comments. Sensor startup failure is reported as not recorded, with bounded diagnostics; backend finalization requires support for \`start_failed\`." \
              "" \
              "The default Jibril version is explicitly pinned in the action metadata at this release's commit. Existing SHA-pinned workflows change only when their pin is updated." \
              "" \
              "To pin exactly to this published version, use \`garnet-org/action@$TAG_NAME\`." \
              "" \
              "The floating major tag \`$MAJOR_TAG\` is updated in place for each new \`$MAJOR_TAG.x.x\` release, so the GitHub Releases tab keeps a single up-to-date release entry for this major version." \
              "" \
              "To track the latest unreleased code from main instead of a published release tag, use \`garnet-org/action@main\`." \
              "" \
              "See the [versioned README](https://github.com/garnet-org/action/blob/$COMMIT_SHA/README.md), [security guidance](https://github.com/garnet-org/action/blob/$COMMIT_SHA/SECURITY.md), and [Garnet app](https://app.garnet.ai)." \
              "" \
              > release-body.md
            cat release-body.md

            if gh release view "$MAJOR_TAG" >/dev/null 2>&1; then
              gh release edit "$MAJOR_TAG" \
                --title "$RELEASE_TITLE" \
                --target "$COMMIT_SHA" \
                --notes-file release-body.md
            else
              gh release create "$MAJOR_TAG" \
                --title "$RELEASE_TITLE" \
                --target "$COMMIT_SHA" \
                --notes-file release-body.md
            fi
            exit 0
          fi

          if [[ "$TAG_NAME" =~ $PRERELEASE_REGEX ]]; then
            echo "Detected prerelease tag $TAG_NAME; skipping floating major tag update."
            exit 0
          fi

          echo "::error::Release tags must follow semver (v<major>.<minor>.<patch> with optional prerelease/build metadata); got $TAG_NAME"
          exit 1
