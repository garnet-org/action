name: "Garnet Runtime Review"
description: "Records what each job in your workflow did at runtime — processes and network egress — and posts the Execution Profile from the Action stage"
branding:
    icon: "activity"
    color: "purple"
inputs:
    api_token:
        description: "Your Garnet API token from app.garnet.ai"
        required: true
    github_token:
        description: "GitHub token used for pull request comments"
        required: false
        default: ${{ github.token }}
    api_url:
        description: "Garnet API URL"
        required: false
        default: "https://api.garnet.ai"
    jibril_version:
        description: "Jibril version (an exact release such as v2.16.0, or 'latest'). Empty resolves from the action ref: @v2 pins v2.10.8, @v0 tracks daily builds, other refs use 'latest'"
        required: false
        default: ""
    debug:
        description: "Enable debug mode"
        required: false
        default: "false"
outputs:
    profile_result:
        description: "Reserved for the companion GitHub App and control plane; the action does not set it"
    report_url:
        description: "The run's page on app.garnet.ai (https://app.garnet.ai/dashboard/runs/<run-id>). Emitted by the main step so later steps in the same job can read it; the app resolves the run server-side and shows logged-out visitors the public run report"
    agent_id:
        description: "Identifier for the Jibril sensor instance; declared for forward compatibility — the action does not currently set it"
runs:
    using: "node24"
    main: "dist/main/index.js"
    post: "dist/post/index.js"
    post-if: "always()"
