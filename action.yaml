name: "Garnet Runtime Review"
author: "Garnet Labs Inc."
description: "Execution evidence for code review: what each CI job ran and reached, recorded at the kernel."
branding:
    icon: "activity"
    color: "purple"
inputs:
    api_token:
        description: |
            Garnet API token from app.garnet.ai. Optional when the job has `id-token: write`
            (GitHub OIDC is the preferred authentication method). Without OIDC, providing this
            token authenticates with the Garnet control plane for the best review quality.
            If neither OIDC nor api_token is available, the action still runs and writes a
            best-effort local Execution Summary to the job's Step Summary, but execution
            evidence is not sent to the control plane.
        required: false
    github_token:
        description: "GitHub token used by `gh attestation verify` when verifying the Jibril binary. Defaults to the built-in GITHUB_TOKEN."
        required: false
        default: ${{ github.token }}
    api_url:
        description: "Garnet API URL"
        required: false
        default: "https://api.garnet.ai"
    jibril_version:
        description: "Jibril version (for example v2.16.0, v0.0, or 'latest'); empty resolves from the action tag"
        required: false
        default: ""
    debug:
        description: "Enable debug mode"
        required: false
        default: "false"
    preview:
        description: "Render the full-fidelity Step Summary record (assertions + evidence). Preview shape is unstable and may change without a major version bump"
        required: false
        default: "false"
outputs:
    profile_result:
        description: "Reserved for the companion GitHub App and control plane; this action records the Runtime Review"
    report_url:
        description: "Link to the run's Execution Profiles on app.garnet.ai"
    agent_id:
        description: "Identifier for the Jibril sensor instance that recorded this Runtime Review"
runs:
    using: "node24"
    main: "dist/main/index.js"
    post: "dist/post/index.js"
    post-if: "always()"
