name: "Garnet Runtime Review"
author: "Garnet Labs Inc."
description: "Execution evidence for code review: what each CI job ran and reached, recorded at the kernel."
branding:
    icon: "activity"
    color: "purple"
inputs:
    api_token:
        description: |
            Garnet API token from app.garnet.ai. Optional when the job has `id-token: write`
            (GitHub OIDC is the preferred authentication method). When set, the token is used
            as-is and no OIDC token is requested, so `id-token: write` is not needed.
            If neither OIDC nor api_token is available, runtime recording is skipped with
            a warning and a Job Summary explanation. The workflow continues.
        required: false
    github_token:
        description: "GitHub token used to verify Jibril attestations and read workflow job status. Defaults to the built-in GITHUB_TOKEN."
        required: false
        default: ${{ github.token }}
    api_url:
        description: "Garnet API URL"
        required: false
        default: "https://api.garnet.ai"
    jibril_version:
        description: "Jibril version (for example v2.16.0, v0.0, or 'latest'); empty resolves from the action tag"
        required: false
        default: "v2.17.0"
    debug:
        description: "Enable debug mode"
        required: false
        default: "false"
    preview:
        description: "Render the full-fidelity Step Summary record (assertions + evidence). Preview shape is unstable and may change without a major version bump"
        required: false
        default: "false"
    stop_timeout_seconds:
        description: |
            Maximum seconds Jibril is given at shutdown to finish writing its Execution Profile and flushing
            events. The post step waits this long (plus a small grace) and then force stops the sensor,
            so a heavy backlog cannot stall the job indefinitely. Lower it to bound the post step;
            raise it on long jobs where the profile matters more than post-step latency. Set to `0`
            or a negative integer to disable the flush timeout entirely.
        required: false
        default: "1800"

outputs:
    profile_result:
        description: "Reserved for compatibility; this action does not set profile_result"
    report_url:
        description: "Run URL set before capture; use the comment or Step Summary for an exact profile permalink"
    agent_id:
        description: "Registered sensor identifier; registration alone does not confirm capture"
runs:
    using: "node24"
    main: "dist/main/index.js"
    post: "dist/post/index.js"
    post-if: "always()"
