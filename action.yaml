name: "Garnet Runtime Review"
author: "Garnet Labs Inc."
description: "Records CI execution and outbound connections in the Step Summary; the Garnet App posts Runtime Reviews on PRs."
branding:
    icon: "activity"
    color: "purple"
inputs:
    api_token:
        description: |
            Garnet API token from app.garnet.ai. Optional when the job has `id-token: write`
            (GitHub OIDC). When set, the token is used as-is instead of OIDC.
            If neither OIDC nor api_token is available, a pull request run is recorded locally and
            uploaded as a workflow artifact for the Garnet GitHub App to collect. This includes
            pull_request runs from forks, which get neither secrets nor OIDC. On any other event runtime
            recording is skipped with a warning and a Job Summary explanation. The workflow continues.
        required: false
    github_token:
        description: "GitHub token used to verify Jibril attestations and read workflow job status. Defaults to the built-in GITHUB_TOKEN."
        required: false
        default: ${{ github.token }}
    api_url:
        description: "Garnet API URL"
        required: false
        default: "https://api.garnet.ai"
    jibril_version:
        description: "Jibril release tag or 'latest'; empty uses the Action's stable pin except @v0 (v0.0) and @v1 (v2.10.4)"
        required: false
        default: "v2.18.0"
    job_index:
        description: |
            Index of this leg within a matrix job. Strongly recommended on matrix jobs: set it to
            the strategy.job-index expression. Every leg of a matrix shares the same job name, so
            without this the Runtime Review reports a single leg instead of all of them and cannot
            line legs up against the previous commit. Leave unset on non-matrix jobs.
        required: false
    job_total:
        description: |
            Optional, matrix jobs only. Number of legs in the matrix: set it to the
            strategy.job-total expression next to job_index. The Step Summary then labels the leg
            "<job> (i of N)"; without it the leg shows the bare job name. Leave unset on non-matrix jobs.
        required: false
    debug:
        description: "Enable verbose logging and upload Jibril logs as artifacts"
        required: false
        default: "false"
    preview:
        description: "Render the full-fidelity Step Summary record (assertions + evidence). Preview shape is unstable and may change without a major version bump"
        required: false
        default: "false"
    show_detections:
        description: "Show the sensor's detection labels (for example exec_from_unusual_dir) next to recorded destinations in the Step Summary. Off by default"
        required: false
        default: "false"
    stop_timeout_seconds:
        description: |
            Maximum seconds Jibril is given at shutdown to finish writing its Execution Profile and flushing
            events. The post step waits this long (plus a small grace) and then force stops the sensor.
            Interrupting shutdown can lose the profile; a longer timeout does not guarantee a profile. Set to `0`
            or a negative integer to disable the flush timeout entirely.
        required: false
        default: "1800"

outputs:
    profile_result:
        description: "Reserved for compatibility; this action does not set profile_result"
    report_url:
        description: "Run URL set before capture; use the comment or Step Summary for an exact profile permalink"
    agent_id:
        description: "Sensor identifier assigned at registration; registration alone does not confirm capture"
runs:
    using: "node24"
    main: "dist/main/index.js"
    post: "dist/post/index.js"
    post-if: "always()"
