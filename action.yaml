name: "Garnet Runtime Review"
author: "Garnet Labs Inc."
description: "Execution evidence for code review: what each CI job ran and reached, recorded at the kernel, posted on your PRs."
branding:
    icon: "activity"
    color: "purple"
inputs:
    api_token:
        description: "Your Garnet API token from app.garnet.ai"
        required: false
    github_token:
        description: "GitHub token used for pull request comments"
        required: false
        default: ${{ github.token }}
    api_url:
        description: "Garnet API URL"
        required: false
        default: "https://api.garnet.ai"
    jibril_version:
        description: "Jibril version (for example v2.16.0, v0.0, or 'latest'); empty resolves from the action tag"
        required: false
        default: ""
    skip_signature_verification:
        description: "Install the Jibril sensor without verifying its checksum and build attestation (not recommended)"
        required: false
        default: "false"
    debug:
        description: "Enable debug mode"
        required: false
        default: "false"
    preview:
        description: "Render the full-fidelity Step Summary record (assertions + evidence). Preview shape is unstable and may change without a major version bump"
        required: false
        default: "false"
outputs:
    profile_result:
        description: "Reserved for the companion GitHub App and control plane; this action records the Runtime Review"
    report_url:
        description: "Link to the run's Execution Profiles on app.garnet.ai"
    agent_id:
        description: "Identifier for the Jibril sensor instance that recorded this Runtime Review"
runs:
    using: "node24"
    main: "dist/main/index.js"
    post: "dist/post/index.js"
    post-if: "always()"
